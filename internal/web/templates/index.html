<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Scoreboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 2rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
    	.controls {
    	    display: flex;
    	    justify-content: center;
    	    margin-bottom: 2rem;
    	}
    	.controls form {
    	    background-color: #1e293b;
    	    padding: 0.75rem 1.5rem;
    	    border-radius: 8px;
    	    border: 1px solid #334155;
    	    display: flex;
    	    align-items: center;
    	    gap: 0.75rem;
    	}
    	.controls label {
    	    font-weight: 600;
    	    color: #94a3b8;
	    }
	    .controls select {
	        background-color: #0f172a;
	        color: #38bdf8;
	        border: 1px solid #334155;
	        padding: 0.5rem 1rem;
	        border-radius: 6px;
	        font-size: 1rem;
	        font-weight: 600;
	        cursor: pointer;
	        outline: none;
	    }
	    .controls select:focus {
	        border-color: #38bdf8;
	    }
        .league-title {
            font-size: 0.875rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.5rem;
        }
        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
	    }
        .score {
            font-weight: bold;
            font-family: monospace;
            font-size: 1.25rem;
            color: #f1f5f9;
            transition: color 0.3s ease, transform 0.2s ease;
        }
        .score-updated {
            color: #4ade80 !important;
            transform: scale(1.15);
        }
        .user-team {
            color: #38bdf8;
            font-weight: 600;
        }
        .opponent-team {
            color: #cbd5e1;
        }
        .vs-divider {
            text-align: center;
            color: #64748b;
            font-size: 0.75rem;
            font-weight: bold;
            margin: 0.25rem 0;
        }
    </style>
</head>
<body>
    <h1>🏈 Fantasy Football Scoreboard - Week {{ .Week }}</h1>

    <div class="controls">
        <form method="GET" action="/" id="weekForm">
            <label for="weekSelect">Select View:</label>
            <select id="weekSelect" name="week" onchange="this.form.submit()">
                {{ $currentWeek := .Week }}
                {{ range .AvailableWeeks }}
                    <option value="{{ . }}" {{ if eq . $currentWeek }}selected{{ end }}>
                        Week {{ . }}
                    </option>
                {{ end }}
            </select>
            <select name="league" onchange="this.form.submit()">
                <option value="my_matchups" {{ if eq .SelectedLeague "my_matchups" }}selected{{ end }}>
                    My Matchups (All Leagues)
                </option>
                {{ range .Leagues }}
                    <option value="{{ .ID }}" {{ if eq .ID $.SelectedLeague }}selected{{ end }}>
                        {{ .Alias }}
                    </option>
                {{ end }}
            </select>
        </form>
    </div>

    <div class="grid" id="matchups-grid">
       {{ range .Matchups }}
       <div class="card" data-league="{{ .LeagueName }}">
          <div class="league-title">League: {{ .LeagueName }}</div>
        
            <div class="team-row user-team">
                <span>{{ .UserTeam }}</span>
                <span class="score" data-league-id="{{ .LeagueID }}" data-owner-id="{{ .UserOwnerID }}">{{ printf "%.2f" .UserScore }}</span>
            </div>

            <div class="vs-divider">VS</div>

            <div class="team-row opponent-team">
                <span>{{ .OpponentTeam }}</span>
                <span class="score" data-league-id="{{ .LeagueID }}" data-owner-id="{{ .OpponentOwnerID }}">{{ printf "%.2f" .OpponentScore }}</span>
            </div>
       </div>
       {{ else }}
       <p style="text-align: center; grid-column: 1 / -1;">No matchups found for this week.</p>
       {{ end }}
    </div>

    <script>
        const eventSource = new EventSource('/api/stream');

        eventSource.onmessage = function(event) {
            try {
                const updatedMatchups = JSON.parse(event.data);

                updatedMatchups.forEach(matchup => {
                    const userScoreEl = document.querySelector(
                        `[data-league-id="${matchup.league_id}"][data-owner-id="${matchup.user_owner_id}"]`
                    );
                    const oppScoreEl = document.querySelector(
                        `[data-league-id="${matchup.league_id}"][data-owner-id="${matchup.opponent_owner_id}"]`
                    );

                    if (userScoreEl) {
                        updateScore(userScoreEl, matchup.user_score);
                    }
                    if (oppScoreEl) {
                        updateScore(oppScoreEl, matchup.opponent_score);
                    }
                });
            } catch (err) {
                console.error("Error processing live score event:", err);
            }
        };

        function updateScore(element, newScore) {
            const formattedScore = parseFloat(newScore).toFixed(2);
        
            if (element.textContent.trim() !== formattedScore) {
                console.log('Score changed for', element, 'from ${element.textContent.trim()} to ${formattedScore}');
                element.textContent = formattedScore;
                element.classList.add('score-updated');
                setTimeout(() => {
                    element.classList.remove('score-updated');
                }, 1000);
            }
        }

        eventSource.onerror = function(err) {
            console.warn("EventSource disconnected or reconnecting...", err);
        };
    </script>
</body>
</html>
